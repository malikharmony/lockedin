{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 text-center mb-4">
      <h1 class="text-primary fw-bold">Welcome Back!</h1>
    </div>

    <div class="col-11 col-sm-9 col-md-7 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="card-title text-center text-muted fs-5 mb-3">Sign In</h2>
          <hr class="my-3 text-secondary">

          <form method="post" action="{% url 'accounts.login' %}">
            {% csrf_token %}

            <div class="mb-3">
              <label for="login_identifier" class="form-label fw-medium">Username or Email:</label>
              <input type="text" class="form-control" id="login_identifier" name="login_identifier" placeholder="johndoe or johndoe@mail.com" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-medium">Password:</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="********" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <a href="#" class="text-primary text-decoration-none small">Forgot Password?</a>
              <button type="submit" class="btn btn-primary px-4">Sign In</button>
            </div>

            <hr class="my-3 text-secondary">

            <div class="text-center">
              <span class="text-muted small">Not a member yet? </span>
              <a href="{% url 'accounts.signup' %}" class="text-primary text-decoration-none small fw-medium">Join us</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
